name: Build Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build & Package Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate Project & Ensure Gradle Wrapper
        run: |
          echo "=== Workspace contents ==="
          ls -la

          # 1. Projekt-Verzeichnis lokalisieren (falls in Subdirectory exportiert)
          if [ -f "settings.gradle.kts" ]; then
            TARGET_DIR="."
          elif [ -f "applet/settings.gradle.kts" ]; then
            TARGET_DIR="applet"
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              TARGET_DIR=$(dirname "$FOUND")
            else
              TARGET_DIR="."
            fi
          fi

          echo "Projekt-Verzeichnis ist: $TARGET_DIR"
          echo "PROJECT_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

          cd "$TARGET_DIR"

          # 2. Falls gradlew fehlt oder der Wrapper unvollstaendig ist, erzeuge ihn direkt
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradlew oder gradle-wrapper.jar fehlt. Erzeuge Gradle Wrapper mit Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

          # 3. Ausfuehrungsrechte sicherstellen
          chmod +x gradlew
          ls -la gradlew

      - name: Prepare Environment & Keystore
        run: |
          cd "${{ env.PROJECT_DIR }}"

          # Fallback fuer Umgebungsvariablen (.env)
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Debug Keystore vorbereiten falls noetig
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -dname "CN=Android Debug,O=Android,C=US" -keypass android -storepass android \
                -keyalg RSA -keysize 2048 -validity 10000
            fi
          fi

      - name: Build Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find and Verify Debug APK
        id: apk-check
        run: |
          APK_PATH=$(find "${{ env.PROJECT_DIR }}" -name "*debug*.apk" -not -path "*/.*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Fehler: Keine Debug APK generiert!"
            exit 1
          fi
          echo "Gefundene APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MyDocAnizer-Debug-APK
          path: ${{ steps.apk-check.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
